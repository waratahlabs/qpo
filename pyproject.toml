[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qpo"
version = "0.1.0"
description = "Quantum-assisted prompt optimization: dual hardware validation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Waratahlabs", email = "quantum@waratahlabs.com"}]
keywords = ["quantum", "prompt-optimization", "llm", "qaoa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pennylane>=0.33.0",
    "pennylane-lightning>=0.33.0",
    "flask>=2.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gpu = [
    "pennylane-lightning[gpu]>=0.33.0",
]
bedrock = [
    "boto3>=1.34.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "black>=23.9.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
qpo = "qpo.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qpo"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = "test_*.py"
